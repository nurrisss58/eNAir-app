<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment · eNAir</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="enair-app.css?v=52">
<link rel="stylesheet" href="enair-flow.css?v=52">
</head>
<body data-page="mobilePay" class="mobile-view">
<div class="m-top"><a href="enair-post-booking.html">eNAir</a>
  <a class="menu" href="enair-post-booking.html">☰</a></div>
<main class="m-shell">
  <h1 class="m-title">Payment</h1>

  <div class="m-card">
    <div class="sum-row"><span>Fare · 2 passengers</span><strong>₸604,660</strong></div>
    <div class="sum-row"><span>Seats 12A · 12B</span><strong>₸49,000</strong></div>
    <div class="divider"></div>
    <div class="sum-row"><span>Total</span><strong style="font-size:20px">₸653,660</strong></div>
  </div>

  <form id="pay-form" novalidate>
    <div class="m-card">
      <div class="field" id="f-card-number">
        <label for="card-number">Card number</label>
        <input class="input" id="card-number" placeholder="4242 4242 4242 4242" inputmode="numeric">
        <span class="error">Enter a valid card number</span>
      </div>
      <div class="field-grid">
        <div class="field"><label for="card-exp">Expiry</label><input class="input" id="card-exp" placeholder="09/29"></div>
        <div class="field"><label for="card-cvc">CVC</label><input class="input" id="card-cvc" placeholder="123" inputmode="numeric"></div>
      </div>
      <label class="check"><input type="checkbox" checked> Save this card for future bookings</label>
    </div>
    <p class="hint">Encrypted · 3-D Secure · no card details are stored in the demo.</p>
  </form>
</main>
<div class="m-bottom"><button class="btn btn-primary" type="submit" form="pay-form">Pay ₸653,660</button></div>
<div id="toast" class="toast"></div>
<script src="flow.js?v=52"></script>
<script src="auth-nav.js"></script>
</body>
</html>
