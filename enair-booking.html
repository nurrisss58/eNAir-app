<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eNAir Booking</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Geist', Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(255,255,255,0.9);
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.05em;
      cursor: pointer;
    }
    .nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
      flex-wrap: wrap;
    }
    .nav-links div, .book-now-btn {
      cursor: pointer;
      font-weight: 600;
      color: #334155;
    }
    .book-now-btn {
      background: linear-gradient(110deg, #06b6d4, #8b5cf6);
      color: white;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 700;
    }
    .hero {
      padding: 72px 40px 40px;
      background: linear-gradient(135deg, #0f172a 0%, #1d4ed8 100%);
      color: white;
      text-align: center;
    }
    .eyebrow {
      display: inline-block;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    .hero h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 62px);
      line-height: 1.05;
    }
    .results {
      max-width: 1200px;
      margin: 36px auto;
      padding: 0 20px 60px;
    }
    .results-header {
      margin-bottom: 20px;
    }
    .results-header h2 {
      margin: 0 0 8px;
      font-size: 30px;
    }
    .results-header p {
      margin: 0;
      color: #64748b;
    }
    .flights-list {
      display: grid;
      gap: 18px;
    }
    .flight-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
    }
    .flight-route {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .flight-meta {
      color: #475569;
      line-height: 1.6;
      font-size: 14px;
    }
    .flight-price-box {
      text-align: right;
      min-width: 140px;
    }
    .flight-price {
      display: block;
      font-size: 28px;
      font-weight: 800;
      color: #0f172a;
    }
    .flight-select {
      margin-top: 10px;
      border: 0;
      border-radius: 999px;
      background: #0f172a;
      color: white;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .error-box {
      background: #fff1f2;
      color: #be123c;
      padding: 18px 20px;
      border: 1px solid #fecdd3;
      border-radius: 14px;
    }
    @media (max-width: 700px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        padding: 18px 20px;
      }
      .nav-links {
        gap: 12px;
        font-size: 14px;
      }
      .flight-card {
        flex-direction: column;
        align-items: flex-start;
      }
      .flight-price-box {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">eNAir</div>
    <nav class="nav-links" aria-label="Main navigation">
      <div>Destinations</div>
      <div>Book Flights</div>
      <div>Our Fleet</div>
      <div>Loyalty</div>
      <div>About eNAir</div>
    </nav>
    <button class="book-now-btn" type="button">Book Now</button>
  </header>

  <main>
    <section class="hero">
      <div class="eyebrow">Instant flight booking</div>
      <h1>Book your next journey</h1>
    </section>

    <section class="results">
      <div class="results-header">
        <h2>Available Outbound Flights</h2>
        <p>Loaded from Database 🚀</p>
      </div>
      <div id="flights-container" class="flights-list"></div>
    </section>
  </main>

  <script>
    async function loadFlightsFromDB() {
      const container = document.getElementById('flights-container');
      if (!container) return;

      try {
        const response = await fetch('/api/flights', {
          method: 'GET',
          headers: { 'Accept': 'application/json' }
        });

        if (!response.ok) {
          throw new Error(`Flight request failed with status ${response.status}`);
        }

        const flights = await response.json();
        container.innerHTML = '';

        if (!Array.isArray(flights) || flights.length === 0) {
          const empty = document.createElement('p');
          empty.className = 'error-box';
          empty.textContent = 'No outbound flights are currently available.';
          container.appendChild(empty);
          return;
        }

        flights.forEach((flight) => {
          const card = document.createElement('article');
          card.className = 'flight-card';

          const left = document.createElement('div');
          left.innerHTML = `
            <div class="flight-route">${flight.departure_city || 'Origin'} → ${flight.arrival_city || 'Destination'}</div>
            <div class="flight-meta">
              Flight ${flight.flight_number || '—'}<br>
              Departure: ${flight.departure_time || '—'}<br>
              Arrival: ${flight.arrival_time || '—'}<br>
              Seats available: ${flight.seats_available != null ? flight.seats_available : '—'}
            </div>
          `;

          const priceBox = document.createElement('div');
          priceBox.className = 'flight-price-box';

          const price = document.createElement('span');
          price.className = 'flight-price';
          price.textContent = `$${Number(flight.price || 0).toFixed(0)}`;

          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'flight-select';
          button.textContent = 'Select';
          button.addEventListener('click', () => {
            if (typeof window.enairSelectDatabaseFlight === 'function') {
              window.enairSelectDatabaseFlight(flight);
              return;
            }
            console.log('Selected flight:', flight);
          });

          priceBox.appendChild(price);
          priceBox.appendChild(button);
          card.appendChild(left);
          card.appendChild(priceBox);
          container.appendChild(card);
        });
      } catch (error) {
        console.error('Unable to load flights from the Flask API:', error);
        container.innerHTML = '';
        const msg = document.createElement('p');
        msg.className = 'error-box';
        msg.textContent = 'Unable to load flights. Check that the Flask server is running and try again.';
        container.appendChild(msg);
      }
    }

    window.enairSelectDatabaseFlight = function (flight) {
      console.log('Selected DB flight:', flight);
      alert(`Selected ${flight.flight_number} for ${flight.departure_city} → ${flight.arrival_city}`);
    };

    document.addEventListener('DOMContentLoaded', loadFlightsFromDB);
  </script>

  <script src="navigation.js"></script>
</body>
</html>
